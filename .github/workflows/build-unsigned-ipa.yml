name: Build Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        required: false
        default: Release
        type: choice
        options:
          - Release
          - Debug
      scheme:
        description: Optional Xcode scheme override
        required: false
        default: ""
        type: string
      search_depth:
        description: Max depth used by `find -maxdepth` to locate .xcworkspace/.xcodeproj
        required: false
        default: "6"
        type: string

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ÉTAPE AJOUTÉE : Configuration de Java (Nécessaire pour Kotlin/KMP)
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ÉTAPE AJOUTÉE : Compilation du Framework Kotlin pour iOS
      # Cela génère les fichiers dont Xcode a besoin
      - name: Build Kotlin Framework
        run: ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode

      - name: Select project or workspace
        id: xcode_target
        shell: bash
        run: |
          set -euo pipefail
          depth="${{ inputs.search_depth }}"
          workspace="$(find . -maxdepth "${depth}" -name '*.xcworkspace' -print -quit || true)"
          project="$(find . -maxdepth "${depth}" -name '*.xcodeproj' -print -quit || true)"

          if [[ -n "${workspace}" ]]; then
            echo "container_type=workspace" >> "$GITHUB_OUTPUT"
            echo "container_path=${workspace}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${project}" ]]; then
            echo "container_type=project" >> "$GITHUB_OUTPUT"
            echo "container_path=${project}" >> "$GITHUB_OUTPUT"
          else
            echo "No .xcworkspace/.xcodeproj found in repository." >&2
            exit 1
          fi

      - name: Detect scheme
        id: scheme
        shell: bash
        run: |
          set -euo pipefail
          input_scheme="${{ inputs.scheme }}"
          if [[ -n "${input_scheme}" ]]; then
            echo "name=${input_scheme}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          container_type="${{ steps.xcode_target.outputs.container_type }}"
          container_path="${{ steps.xcode_target.outputs.container_path }}"
          
          if [[ "${container_type}" == "workspace" ]]; then
            list_output="$(xcodebuild -list -json -workspace "${container_path}")"
          else
            list_output="$(xcodebuild -list -json -project "${container_path}")"
          fi

          scheme="$(echo "${list_output}" | ruby -rjson -e '
            data = JSON.parse(STDIN.read)
            root = data["workspace"] || data["project"] || {}
            schemes = root["schemes"] || []
            selected = schemes.find { |s| s.to_s !~ /(Tests|UITests)$/ } || schemes.first
            puts selected.to_s
          ')"
          echo "name=${scheme}" >> "$GITHUB_OUTPUT"

      - name: Build archive without signing
        shell: bash
        run: |
          set -euo pipefail
          container_type="${{ steps.xcode_target.outputs.container_type }}"
          container_path="${{ steps.xcode_target.outputs.container_path }}"
          scheme="${{ steps.scheme.outputs.name }}"
          configuration="${{ inputs.configuration }}"

          build_args=(
            -scheme "${scheme}"
            -configuration "${configuration}"
            -sdk iphoneos
            -archivePath "${GITHUB_WORKSPACE}/build/App.xcarchive"
            archive
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
            CODE_SIGN_IDENTITY=""
            DEVELOPMENT_TEAM=""
          )

          if [[ "${container_type}" == "workspace" ]]; then
            xcodebuild -workspace "${container_path}" "${build_args[@]}"
          else
            xcodebuild -project "${container_path}" "${build_args[@]}"
          fi

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          apps_dir="${GITHUB_WORKSPACE}/build/App.xcarchive/Products/Applications"
          app_path="$(find "${apps_dir}" -maxdepth 1 -name '*.app' -print -quit || true)"
          
          mkdir -p "${GITHUB_WORKSPACE}/build/Payload"
          cp -R "${app_path}" "${GITHUB_WORKSPACE}/build/Payload/"
          cd "${GITHUB_WORKSPACE}/build"
          zip -r "unsigned.ipa" "Payload"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Breadcrumb-Unsigned-${{ inputs.configuration }}
          path: build/unsigned.ipa
