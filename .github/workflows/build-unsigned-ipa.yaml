name: Build iOS (Unsigned)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options: [Release, Debug]

jobs:
  build-ios:
    name: Build Unsigned IPA
    runs-on: macos-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Kotlin Framework
        run: |
          # Liaison du code Kotlin vers le framework Apple
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode \
            -Pkotlin.native.apple.target=iphoneos \
            -Pkotlin.native.cocoapods.platform=iphoneos \
            -Pkotlin.native.cocoapods.archs=arm64 \
            -Pkotlin.native.cocoapods.configuration=${{ github.event.inputs.configuration || 'Release' }} \
            -Pcompose.ios.resources.deletion.disabled=true
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
          PLATFORM_NAME: iphoneos
          SDK_NAME: iphoneos
          ARCHS: arm64
          CONFIGURATION: Release
          ACTION: build
          PRODUCT_BUNDLE_IDENTIFIER: com.paul.breadcrumb
          BUILT_PRODUCTS_DIR: ${{ github.workspace }}/build/dummy
          TARGET_BUILD_DIR: ${{ github.workspace }}/build/dummy
          FRAMEWORKS_FOLDER_PATH: Frameworks

      - name: Detect Xcode Project
        id: xcode_info
        run: |
          WORKSPACE=$(find . -maxdepth 3 -name "*.xcworkspace" -print -quit)
          if [ -n "$WORKSPACE" ]; then
            echo "path=$WORKSPACE" >> $GITHUB_OUTPUT
            echo "type=workspace" >> $GITHUB_OUTPUT
          else
            PROJECT=$(find . -maxdepth 3 -name "*.xcodeproj" -print -quit)
            echo "path=$PROJECT" >> $GITHUB_OUTPUT
            echo "type=project" >> $GITHUB_OUTPUT
          fi

      - name: Detect Scheme
        id: scheme
        run: |
          TARGET_PATH="${{ steps.xcode_info.outputs.path }}"
          TYPE="${{ steps.xcode_info.outputs.type }}"
          
          if [ "$TYPE" == "workspace" ]; then
            SCHEME=$(xcodebuild -list -json -workspace "$TARGET_PATH" | ruby -rjson -e 'puts JSON.parse(STDIN.read)["workspace"]["schemes"].find { |s| s !~ /Tests/ }')
          else
            SCHEME=$(xcodebuild -list -json -project "$TARGET_PATH" | ruby -rjson -e 'puts JSON.parse(STDIN.read)["project"]["schemes"].find { |s| s !~ /Tests/ }')
          fi
          echo "name=$SCHEME" >> $GITHUB_OUTPUT

      - name: Build Archive (No Signing)
        run: |
          ARG_TYPE="-${{ steps.xcode_info.outputs.type }}"
          CONFIG="${{ github.event.inputs.configuration || 'Release' }}"
          
          xcodebuild $ARG_TYPE "${{ steps.xcode_info.outputs.path }}" \
            -scheme "${{ steps.scheme.outputs.name }}" \
            -configuration $CONFIG \
            -sdk iphoneos \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Create IPA Package
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/App.xcarchive/Products/Applications -name "*.app" -maxdepth 1)
          if [ -z "$APP_PATH" ]; then
            echo "Erreur : Fichier .app introuvable."
            exit 1
          fi
          cp -R "$APP_PATH" build/Payload/
          cd build && zip -r Breadcrumb_iOS_Unsigned.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Unsigned-IPA
          path: build/Breadcrumb_iOS_Unsigned.ipa
